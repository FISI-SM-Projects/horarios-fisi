services:
  postgres:
    image: postgres:18-alpine
    container_name: horarios-fisi-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: horarios_fisi
    volumes:
      - horarios_pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d horarios_fisi"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - 5432:5432

volumes:
  horarios_pgdata_dev:
